<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôle visuel des effets</title><style>body{margin:0;background:#10203a;color:#fff;font:16px sans-serif}button{padding:12px;margin:8px;background:#245984;color:white;border:1px solid #a3d1e7;border-radius:8px}canvas{max-width:100%;height:auto!important}</style><button id="fire">Explosion</button><button id="electric">Impact électrique</button><button id="pause">Pause / Reprendre</button><div id="preview"></div><script type="module">
import Phaser from 'phaser';import {createTextures} from '../src/textures.js';import {GameEffects} from '../src/effects.js';
class Preview extends Phaser.Scene{preload(){for(const k of ['missile','zapper','drone','printer'])this.load.image(`${k}-art`,`/art/${k}-art.webp`);this.load.image('reception','/art/reception.webp');for(const k of ['sled','hover','rocket','elf-arcade'])this.load.image(k,`/art/${k}.webp`);this.load.spritesheet('explosion','/art/explosion.webp',{frameWidth:384,frameHeight:384});}create(){this.W=1100;this.reduced=false;createTextures(this);this.add.image(820,410,'reception').setDisplaySize(500,290);this.effects=new GameEffects(this);this.obs=[];for(const [i,type]of ['zapper','missile','drone'].entries()){const sprite=this.add.image(150+i*220,230,`${type}-art`);sprite.setDisplaySize(type==='zapper'?85:130,type==='zapper'?220:70);this.obs.push({type,sprite});}this.add.image(830,170,'elf-arcade').setDisplaySize(90,64);this.add.image(830,170,'shield-bubble').setDisplaySize(144,150);for(const [i,k]of ['sled','hover','rocket'].entries())this.add.image(180+i*230,440,k).setDisplaySize(150,65);this.live=true;document.getElementById('fire').onclick=()=>this.effects.impact(480,410);document.getElementById('electric').onclick=()=>this.effects.impact(150,230,true);document.getElementById('pause').onclick=()=>this.live=!this.live;}update(t,d){this.effects?.update(Math.min(d/1000,.033),this.obs,this.live);}}
new Phaser.Game({type:Phaser.CANVAS,parent:'preview',width:1100,height:550,backgroundColor:'#10203a',scene:Preview,audio:{noAudio:true}});
</script></html>
