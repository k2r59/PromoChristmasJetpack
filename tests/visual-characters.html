<!doctype html><html lang="fr"><meta charset="utf-8"><title>QA personnages et véhicules</title><style>body{margin:0;background:#142638;color:white;font:14px system-ui}button{padding:10px;margin:4px}canvas{width:100%;height:auto}#status{padding:5px}</style><button id="walk">Marcher</button><button id="greet">Saluer</button><button id="duck">S’accroupir</button><button id="pause">Pause</button><button id="sound">Son</button><button id="impact">Explosion</button><button id="retry">Relancer</button><div id="status">Chargement</div><div id="game"></div><script type="module">
import Phaser from 'phaser';import{PARTS,COLLEAGUE_SCALE,createColleague,animateColleague}from'../src/colleagues.js';import{VEHICLES,VEHICLE_ORIGIN,groundedVehiclePose,vehicleBottomExtent}from'../src/vehicles.js';import{Sound}from'../src/audio.js';
const sound=new Sound(true);let gesture='walk',paused=false,seconds=0;
class QA extends Phaser.Scene{preload(){for(const key of ['man','woman'])for(const p of PARTS)this.load.image(`rig-${key}-${p}`,`/art/rig-${key}-${p}.webp`);for(const v of Object.values(VEHICLES))this.load.image(v.texture,`/art/${v.texture}.webp`);this.load.spritesheet('elf-run','/art/elf-run.webp',{frameWidth:512,frameHeight:512});}create(){this.add.rectangle(550,251,1100,2,0xffd66b);this.add.rectangle(550,491,1100,2,0xffd66b);this.npcs=['man','woman'].map((k,i)=>createColleague(this,k,180+i*220,250));this.npcs.forEach(c=>c.sprite.setScale(1.8*COLLEAGUE_SCALE));this.anims.create({key:'run',frames:this.anims.generateFrameNumbers('elf-run',{start:0,end:5}),frameRate:12,repeat:-1});this.elf=this.add.sprite(650,250,'elf-run').setDisplaySize(189,189).setOrigin(.5,.94).play('run');this.rides=Object.entries(VEHICLES).map(([type,v],i)=>({type,sprite:this.add.image(200+i*330,400,v.texture).setDisplaySize(v.width,v.height).setOrigin(VEHICLE_ORIGIN.x,VEHICLE_ORIGIN.y)}));for(const id of ['walk','greet','duck'])document.getElementById(id).onclick=()=>gesture=id;document.getElementById('pause').onclick=()=>{paused=!paused;sound.stopAll();};document.getElementById('sound').onclick=()=>{sound.unlock();sound.setEnabled(!sound.enabled);};document.getElementById('impact').onclick=()=>{sound.unlock();sound.impact();};document.getElementById('retry').onclick=()=>{seconds=0;sound.unlock();sound.start();};}update(t,d){const dt=Math.min(d/1000,.033);if(!paused){seconds+=dt;this.elf.anims.resume();this.npcs.forEach(c=>animateColleague(c,dt,gesture==='duck',gesture==='greet'));}else this.elf.anims.pause();let clearance=Infinity;for(const r of this.rides){const y=350+Math.sin(seconds*1.3)*170;const p=groundedVehiclePose(r.type,y,490,Math.sin(seconds)*12);r.sprite.setY(p.y).setAngle(p.angle);clearance=Math.min(clearance,490-p.y-vehicleBottomExtent(r.type,p.angle));}sound.update({active:!paused,thrust:true,seconds});document.getElementById('status').textContent=`Pose ${gesture} · marge sol ${clearance.toFixed(2)} px · audio ${sound.buffers.size}/8 · voix ${sound.voices.size} · ${paused?'pause':'actif'}`;}}
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:1100,height:530,scene:QA,audio:{noAudio:true},backgroundColor:'#142638'});
</script></html>
