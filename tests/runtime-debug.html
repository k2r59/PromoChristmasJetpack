<!doctype html><meta charset="utf-8"><title>Diagnostic runtime</title><p>Chargement diagnostic…</p><script type="module">
const html=await fetch('/').then(r=>r.text());
const diagnostic=`<script>setInterval(()=>{let p=document.getElementById('qa-runtime-status');if(!p){p=document.createElement('p');p.id='qa-runtime-status';p.style.cssText='position:fixed;z-index:999998;bottom:0;left:0;background:white;color:black;font:14px monospace';document.body.append(p)}p.textContent='DOM '+document.readyState+' visibility '+document.visibilityState+' canvas '+document.querySelectorAll('canvas').length+' load '+document.getElementById('load-progress')?.style.width+' remaining '+JSON.stringify(window.qaLoader?{inflight:[...window.qaLoader.loader.inflight.entries].map(x=>x.key),list:[...window.qaLoader.loader.list.entries].map(x=>x.key),queue:[...window.qaLoader.loader.queue.entries].map(x=>x.key),failed:window.qaLoader.failed}:null);},1000);window.addEventListener('error',e=>{const p=document.createElement('pre');p.setAttribute('role','alert');p.style.cssText='position:fixed;z-index:999999;inset:0;background:#fff;color:#a00000;padding:20px;white-space:pre-wrap;overflow:auto;font:16px monospace';p.textContent='RUNTIME ERROR: '+e.message+'\\n'+(e.error?.stack||e.filename+':'+e.lineno);document.body.append(p)});window.addEventListener('unhandledrejection',e=>{const p=document.createElement('pre');p.setAttribute('role','alert');p.style.cssText='position:fixed;z-index:999999;inset:0;background:#fff;color:#a00000;padding:20px;white-space:pre-wrap;overflow:auto;font:16px monospace';p.textContent='PROMISE ERROR: '+(e.reason?.stack||e.reason);document.body.append(p)});<\/script>`;
document.open();document.write(html.replace('<head>','<head><base href="/">'+diagnostic));document.close();
</script>
