<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Écoute des effets</title><style>body{font:16px system-ui;background:#102447;color:#fff;padding:24px}button{padding:16px;margin:6px;border:0;border-radius:12px;font:inherit}p{max-width:560px;line-height:1.5}</style><h1>Effets de jeu</h1><p>Palette courte Kenney CC0. Pas de moteur permanent ni de musique. Ces boutons utilisent le volume du jeu.</p><div id="buttons"></div><button id="stop">Tout couper</button><script type="module">import{Sound}from'../src/audio.js';const s=new Sound(true);for(const[label,method]of[['Cadeau','collect'],['Explosion','impact'],['Récompense','bonus'],['Bouclier','shield'],['Échec','fail']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{s.unlock();await s.ready;s.stopAll();s.cooldowns.clear();s[method](0);};document.getElementById('buttons').append(b);}document.getElementById('stop').onclick=()=>s.stopAll();</script></html>
